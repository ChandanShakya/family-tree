version: 2
updates:
  # Versions are pinned exactly; keep them pinned. Majors are bumped by hand
  # (e.g. SvelteKit 3 needs a migration); security updates still arrive on their own.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    versioning-strategy: increase
    cooldown:
      default-days: 7
    labels: [dependencies]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
    ignore:
      # Stay on the Node LTS line; move majors by hand together with @types/node and engines.
      - dependency-name: node
        update-types: ['version-update:semver-major']
    groups:
      docker:
        patterns: ['*']
