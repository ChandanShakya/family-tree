name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Type check (svelte-check + tsc)
        run: npm run check:ci
      - name: Colour contrast of design tokens
        run: npm run contrast
      - name: Every acceptance test has a test
        run: npm run check:traceability -- --phase 6
