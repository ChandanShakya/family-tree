name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not include real people's personal data.** For security problems, use a private report (see SECURITY.md) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a tree
        2. Click ...
        3. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag, image tag or commit.
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How do you run it?
      options:
        - Docker (Cloudflare Tunnel)
        - Docker on a Raspberry Pi
        - Docker behind another proxy
        - Local development (npm run dev)
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 130 on Android
  - type: textarea
    id: logs
    attributes:
      label: Server log
      description: Relevant lines from `docker compose logs familytree`, including the request id. Remove secrets.
      render: shell
